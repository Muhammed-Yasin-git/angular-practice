<div

 class="max-w-md mx-auto bg-white shadow-lg rounded-xl p-6 border border-gray-200">
  <!-- Card Header -->
  <div class="flex justify-between items-center mb-5">
    <h2 class="text-2xl font-bold text-blue-700">Labour Card</h2>
    @if (isRegistered) {
        <span  class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
      Active
    </span>
    } @else {
        <span  class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">
      Inactive
    </span>
    }
  </div>

  <!-- Profile -->
  <div class="flex items-center gap-4 mb-6">
    <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-2xl">
      👷
    </div>
    <div>
      <h3 class="text-lg font-semibold">Muhammed Yasin</h3>
      <p class="text-gray-500 text-sm">Construction Worker</p>
    </div>
  </div>

  <!-- Details -->
  <div class="space-y-3">
    <div class="flex justify-between border-b pb-2">
      <span class="text-gray-500">Labour ID</span>
      <span class="font-medium">LAB1025</span>
    </div>

    <div class="flex justify-between border-b pb-2">
      <span class="text-gray-500">Age</span>
      <span class="font-medium">22</span>
    </div>

    <div class="flex justify-between border-b pb-2">
      <span class="text-gray-500">Department</span>
      <span class="font-medium">Construction</span>
    </div>
    <div *ngFor="let worker of workers">
  <p>{{ worker }}</p>
</div>

    <button 
    (click)="toggleRegistered()"
    class="bg-blue-600 text-white px-4 py-2 rounded-lg"
    >Toggle Registration</button>

    <!-- Footer -->
    <div class="mt-6">
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
        View Details
      </button>
    </div>
  </div>
</div>
