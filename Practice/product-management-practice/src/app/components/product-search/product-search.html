<div class="max-w-3xl mx-auto mt-10 p-6">
  <h2 class="text-2xl font-bold mb-6">Product Search</h2>

  <input
    type="text"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearch()"
    placeholder="Search products..."
    class="w-full border rounded-lg p-3"
  />
</div>

@if (products$ | async; as response) {
  @if (response.products.length > 0) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">

      @for (product of response.products; track product.id) {
        <div class="border rounded-lg p-4 shadow-sm">
          <img
            [src]="product.thumbnail"
            [alt]="product.title"
            class="w-full h-40 object-contain"
          />

          <h3 class="font-semibold mt-3">{{ product.title }}</h3>

          <p class="text-gray-600">{{ product.description }}</p>

          <p class="font-bold mt-2">${{ product.price }}</p>
        </div>
      }

    </div>
  } @else {
    <p class="mt-6 text-gray-500">No products found.</p>
  }
}
