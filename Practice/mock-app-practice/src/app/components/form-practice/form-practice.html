<p>form-practice works!</p>

<form [formGroup]="login" (ngSubmit)="onSubmit()">
    <label for="name">Name: </label>
    <input class="border rounded mr-2" type="text" formControlName="name">
    <label for="email">Email: </label>
    <input class="border rounded mr-2" type="email" formControlName="email">
    <label for="password">Password: </label>
    <input  class="border rounded mr-2" type="password" formControlName="password">
    <button type="submit" class="rounded-lg p-2 bg-red-400" [disabled]="login.invalid">Login</button>
</form>
