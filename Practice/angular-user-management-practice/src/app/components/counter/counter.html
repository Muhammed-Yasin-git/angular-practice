<div class="max-w-md mx-auto mt-8 p-6 bg-white rounded-xl shadow-md text-center">
    <p>counter works!</p>

<p>{{ counter() }}</p>

<div class="flex gap-2">
<button (click)="increment()" class="bg-blue-400 p-2 rounded-lg">Increment</button>
<button (click)="decrement()" class="bg-red-400 p-2 rounded-lg">Decrement</button>
<button (click)="reset()" class="bg-gray-400 p-2 rounded-lg">Reset</button>
</div>

</div>
