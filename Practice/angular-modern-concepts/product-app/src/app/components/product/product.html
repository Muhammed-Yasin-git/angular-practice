<p>product works!</p>
<button 
(click)="addProduct()"
class="p-2 rounded-lg bg-green-500 m-2 shadow-md">Add Gaming Laptop</button>

@if (loading()){
    <p>Loading products....</p>
} @else if (error()){
   <p class="text-red-300">{{ error() }}</p>
} @else {
     @for(product of products(); track product.id){
    <img [src]="product.thumbnail" [alt]="product.title">
    <p>{{ product.title}}</p>
    <p>{{ product.price}}</p>
    <button
    class="p-2 rounded-lg bg-blue-500 m-2 shadow-md"
    (click)="editProduct(product.id)"
    >Edit</button>
    <button
    class="p-2 rounded-lg bg-red-500 m-2 shadow-md"
    (click)="deleteProduct(product.id)"
    >Delete</button>
    }
}
