<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow">

  @if (task) {
    <h2 class="text-2xl font-bold mb-6">Task Details</h2>

    <div class="space-y-4">
      <div>
        <h3 class="font-semibold">Title</h3>
        <p>{{ task.title }}</p>
      </div>

      <div>
        <h3 class="font-semibold">Description</h3>
        <p>{{ task.description }}</p>
      </div>

      <div>
        <h3 class="font-semibold">Status</h3>
        <p>{{ task.status }}</p>
      </div>

      <div>
        <h3 class="font-semibold">Priority</h3>
        <p>{{ task.priority }}</p>
      </div>
    </div>
  } @else {
    <p class="text-red-500">Task not found!</p>
  }

</div>
