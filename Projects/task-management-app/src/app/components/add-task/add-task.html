<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-6">Add New Task</h2>

  <form [formGroup]="taskForm" (ngSubmit)="addTask()">

    <!-- Title -->
    <div class="mb-4">
      <label class="block mb-2">Title</label>
      <input
        type="text"
        formControlName="title"
        placeholder="Enter task title"
        class="w-full border rounded-lg p-2"
      />

      @if (taskForm.get('title')?.touched && taskForm.get('title')?.invalid) {
        <p class="text-red-500 text-sm mt-1">Title is required (minimum 3 characters).</p>
      }
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label class="block mb-2">Description</label>
      <textarea
        formControlName="description"
        placeholder="Enter description"
        class="w-full border rounded-lg p-2"
      ></textarea>

      @if (taskForm.get('description')?.touched && taskForm.get('description')?.invalid) {
        <p class="text-red-500 text-sm mt-1">Description is required.</p>
      }
    </div>

    <!-- Status -->
    <div class="mb-4">
      <label class="block mb-2">Status</label>
      <select formControlName="status" class="w-full border rounded-lg p-2">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <!-- Priority -->
    <div class="mb-6">
      <label class="block mb-2">Priority</label>
      <select formControlName="priority" class="w-full border rounded-lg p-2">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <button
      type="submit"
      [disabled]="taskForm.invalid"
      class="bg-blue-600 text-white px-5 py-2 rounded-lg disabled:opacity-50"
    >
      Add Task
    </button>

  </form>
</div>
